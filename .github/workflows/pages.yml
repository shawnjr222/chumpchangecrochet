name: Deploy site

# Publishes only the production site (home page, About page, images). The rest of the repo
# (source parts, build scripts, design concepts, notes) stays in the repo but is not published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir -p _site/assets
          cp index.html story.html CNAME .nojekyll _site/
          cp -R assets/img _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
